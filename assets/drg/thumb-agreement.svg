<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Dot plot: mean agreement with the LLM's Bloom's level assessment rises as the level it assigned rises, from 2.05 at Applying to 1.56 at Creating, on a scale where 1 is totally agree">
  <rect width="1600" height="900" fill="#F3F4F1"/>
  <g font-family="IBM Plex Mono, Menlo, Consolas, monospace" fill="#4A645D" font-size="26" letter-spacing="2">
    <text x="100" y="120">AGREEMENT WITH THE LLM'S ASSESSMENT · MEAN OF 86 RATINGS</text>
  </g>
  <g font-family="Arial Narrow, Helvetica, Arial, sans-serif" font-weight="800" fill="#14302A" font-size="72">
    <text x="100" y="205" textLength="1400" lengthAdjust="spacingAndGlyphs">THE HIGHER IT PLACED THEM, THE MORE THEY AGREED</text>
  </g>
  <!-- gridlines at 1..5 : x = 420 + (v-1)*270 -->
  <g stroke="#14302A" stroke-opacity=".16" stroke-width="2">
    <line x1="420" y1="270" x2="420" y2="720"/><line x1="690" y1="270" x2="690" y2="720"/><line x1="960" y1="270" x2="960" y2="720"/><line x1="1230" y1="270" x2="1230" y2="720"/><line x1="1500" y1="270" x2="1500" y2="720"/>
  </g>
  <line x1="420" y1="720" x2="1500" y2="720" stroke="#14302A" stroke-width="2.5"/>
  <g font-family="IBM Plex Mono, Menlo, Consolas, monospace" fill="#4A645D" font-size="26" text-anchor="middle">
    <text x="420" y="762">1</text><text x="690" y="762">2</text><text x="960" y="762">3</text><text x="1230" y="762">4</text><text x="1500" y="762">5</text>
    <text x="420" y="806" text-anchor="start">TOTALLY AGREE</text><text x="1500" y="806" text-anchor="end">TOTALLY DISAGREE</text>
  </g>
  <!-- rows -->
  <g font-family="Helvetica, Arial, sans-serif" fill="#14302A" font-size="36" text-anchor="end">
    <text x="380" y="342">Applying</text><text x="380" y="452">Analyzing</text><text x="380" y="562">Evaluating</text><text x="380" y="672">Creating</text>
  </g>
  <g stroke="#14302A" stroke-opacity=".35" stroke-width="2" stroke-dasharray="4 8">
    <line x1="420" y1="330" x2="703.5" y2="330"/><line x1="420" y1="440" x2="636" y2="440"/><line x1="420" y1="550" x2="600.9" y2="550"/><line x1="420" y1="660" x2="571.2" y2="660"/>
  </g>
  <g fill="#E8471F" stroke="#F3F4F1" stroke-width="5">
    <circle cx="703.5" cy="330" r="17"/><circle cx="636" cy="440" r="17"/><circle cx="600.9" cy="550" r="17"/><circle cx="571.2" cy="660" r="17"/>
  </g>
  <g font-family="IBM Plex Mono, Menlo, Consolas, monospace" fill="#14302A" font-size="32">
    <text x="740" y="341">2.05</text><text x="672" y="451">1.80</text><text x="637" y="561">1.67</text><text x="607" y="671">1.56</text>
  </g>
</svg>
